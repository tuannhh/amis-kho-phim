name: Production compatibility gate

on:
  pull_request:
  push:
    branches: [main, phan-quyen-4-cap]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend unit, typecheck and build
        working-directory: backend
        run: |
          npm ci
          npm test -- --runInBand
          npx tsc --noEmit
          npm run build

      - name: Frontend unit, typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npx vue-tsc --noEmit
          npm run build

      - name: Start isolated MySQL and MinIO for e2e
        run: docker compose up -d --wait mysql minio

      - name: Backend e2e on real MySQL and MinIO
        working-directory: backend
        run: npm run test:e2e

      - name: Build production backend image and validate deployment manifests
        run: |
          docker compose build backend
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.multi-replica.yml config -q
          docker run --rm \
            -v "$GITHUB_WORKSPACE/deploy/k8s/base:/work:ro" \
            docker/desktop-kubernetes-kubectl:v1.31.4 kustomize /work >/dev/null
          git diff --check

      - name: Runtime dependency audit (block only critical)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical
