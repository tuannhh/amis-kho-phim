apiVersion: apps/v1
kind: Deployment
metadata:
  name: amis-kho-phim-backend
  namespace: amis-kho-phim
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amis-kho-phim-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amis-kho-phim-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: REGISTRY/amis-kho-phim-backend:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: amis-kho-phim-runtime
          env:
            - name: NODE_ENV
              value: production
            - name: MULTI_REPLICA
              value: "true"
            - name: RUN_MIGRATIONS_ON_BOOT
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
