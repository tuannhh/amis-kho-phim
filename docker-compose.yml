# AMIS Kho phim — Docker Compose (prototype).
# 5 service: mysql, minio, backend (NestJS), frontend (Vue tĩnh), nginx (reverse proxy).
# Chạy:  cp .env.example .env  &&  docker compose up -d --build
# Truy cập:  http://localhost:${NGINX_PORT:-8080}

services:
  mysql:
    image: mysql:8.0
    container_name: khophim-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-kho_phim}
      MYSQL_USER: ${DB_USER:-khophim}
      MYSQL_PASSWORD: ${DB_PASSWORD:-khophim}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kho-phim-net]

  minio:
    image: minio/minio:latest
    container_name: khophim-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kho-phim-net]

  # Dùng khi diễn tập multi-replica local; single-instance vẫn không kết nối Redis trừ khi
  # MULTI_REPLICA=true. Giữ service trong compose để cùng lệnh có thể dựng đúng dependency.
  redis:
    image: redis:7.4-alpine
    container_name: khophim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [kho-phim-net]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # GĐ7 — CỜ CHỈ DÀNH CHO MÁY DEV. Khi = "true", backend chấp nhận chạy với secret mẫu
      # (change-me, minioadmin, localhost...) và chỉ in cảnh báo. Bỏ/đặt khác "true" thì
      # backend TỪ CHỐI KHỞI ĐỘNG nếu còn giá trị mặc định. XOÁ khi triển khai thật —
      # xem docs/devops-handoff.md (việc số 1).
      ALLOW_INSECURE_CONFIG: ${ALLOW_INSECURE_CONFIG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      PORT: 3000
      DB_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-khophim}
      DB_PASSWORD: ${DB_PASSWORD:-khophim}
      DB_NAME: ${DB_NAME:-kho_phim}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-superadmin@misa.com.vn}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-Admin@12345}
      SEED_SUPER_ADMIN_NAME: ${SEED_SUPER_ADMIN_NAME:-Super Admin}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      # Endpoint trình duyệt gọi được để upload presigned PUT (ánh xạ cổng host MinIO).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9200}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-kho-phim}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      NEW_FILM_TTL_DAYS: ${NEW_FILM_TTL_DAYS:-14}
      # GĐ6.1 — SSO AMIS Mobile placeholder: rỗng = TẮT (an toàn mặc định). Xem .env.example.
      AMIS_SSO_SHARED_SECRET: ${AMIS_SSO_SHARED_SECRET:-}
      AMIS_SSO_MAX_TTL_SECONDS: ${AMIS_SSO_MAX_TTL_SECONDS:-300}
      # Multi-replica rehearsal/production: fail-fast ở security.config nếu bật mà thiếu Redis
      # hoặc còn để app tự chạy migration. Single-instance mặc định giữ nguyên hành vi cũ.
      MULTI_REPLICA: ${MULTI_REPLICA:-false}
      RUN_MIGRATIONS_ON_BOOT: ${RUN_MIGRATIONS_ON_BOOT:-true}
      REDIS_URL: ${REDIS_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [kho-phim-net]

  frontend:
    build: ./frontend
    container_name: khophim-frontend
    restart: unless-stopped
    networks: [kho-phim-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: khophim-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    networks: [kho-phim-net]

volumes:
  mysql_data:
  minio_data:
  redis_data:

networks:
  kho-phim-net:
    driver: bridge
