# AMIS Kho phim — reverse proxy cho bản test Cloud Run. Sao chép cấu trúc route từ
# nginx/nginx.conf (bản Docker Compose cục bộ): / -> frontend, /api + /media -> backend.
# Khác bản cục bộ: upstream là 2 Cloud Run service khác qua HTTPS (không phải DNS nội bộ
# Docker), nên phải proxy_pass https://<host> + set lại Host header đúng hostname đích để
# Cloud Run route đúng service, và bật SNI (proxy_ssl_server_name) vì nhiều service Cloud Run
# dùng chung front-end HTTPS, phân biệt nhau bằng SNI/Host.
resolver 8.8.8.8 valid=300s;

server {
  listen 8080;
  server_name _;
  charset utf-8;
  client_max_body_size 2048m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  server_tokens off;

  set $backend_host "kho-phim-backend-784559735000.asia-southeast1.run.app";
  set $frontend_host "kho-phim-frontend-784559735000.asia-southeast1.run.app";

  location /api/ {
    proxy_pass https://$backend_host;
    proxy_set_header Host $backend_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $backend_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /media/ {
    proxy_pass https://$backend_host;
    proxy_set_header Host $backend_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $backend_host;
    proxy_buffering off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass https://$frontend_host;
    proxy_set_header Host $frontend_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $frontend_host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
