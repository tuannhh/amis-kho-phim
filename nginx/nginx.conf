# Reverse proxy AMIS Kho phim: / → frontend, /api + /media → backend.
# Cấu hình sẵn cho stream video (Range) ở /media.
# Docker embedded DNS trả nhiều A record khi backend scale. `resolve` + zone giúp nginx cập
# nhật replica khi rollout/scale thay vì đóng băng một IP lúc khởi động; Swarm VIP vẫn tương
# thích. Không dùng resolver công cộng vì hostname này chỉ tồn tại trong network Docker.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream kho_phim_frontend { server frontend:80; }
upstream kho_phim_backend {
  zone kho_phim_backend 64k;
  server backend:3000 resolve;
}

server {
  listen 80;
  server_name _;
  charset utf-8;

  # File video có thể rất lớn → không giới hạn quá nhỏ
  client_max_body_size 2048m;

  # ── GĐ7: security headers (áp cho mọi location vì không location nào tự add_header) ──
  # nosniff: chặn trình duyệt tự đoán lại Content-Type (ảnh bìa/video do người dùng nạp).
  add_header X-Content-Type-Options "nosniff" always;
  # no-referrer: URL có thể chứa ?ssoToken= (scaffold GĐ6.1) — không gửi sang site khác.
  add_header Referrer-Policy "no-referrer" always;
  # App không dùng tính năng nhạy cảm nào của trình duyệt.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # KHÔNG đặt X-Frame-Options/CSP frame-ancestors ở đây: GĐ6.1 dự kiến nhúng app vào khung
  # AMIS Mobile. DevOps chốt giá trị đúng SAU KHI đội AMIS Mobile xác nhận cách nhúng
  # (WebView thật thì không ảnh hưởng; iframe thì cần frame-ancestors allowlist).
  # Xem docs/devops-handoff.md mục "Security headers còn thiếu".
  #
  # HSTS chỉ bật ở tầng TLS termination thật (compose dev chưa có HTTPS):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Không lộ phiên bản nginx.
  server_tokens off;

  # API
  location /api/ {
    proxy_pass http://kho_phim_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Stream media (hỗ trợ Range/seek). Backend sẽ trả 206 Partial Content.
  location /media/ {
    proxy_pass http://kho_phim_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;                 # stream trực tiếp, không đệm
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  # Frontend SPA
  location / {
    proxy_pass http://kho_phim_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
