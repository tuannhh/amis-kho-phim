# Reverse proxy AMIS Kho phim: / → frontend, /api + /media → backend.
# Cấu hình sẵn cho stream video (Range) ở /media.
upstream kho_phim_frontend { server frontend:80; }
upstream kho_phim_backend  { server backend:3000; }

server {
  listen 80;
  server_name _;
  charset utf-8;

  # File video có thể rất lớn → không giới hạn quá nhỏ
  client_max_body_size 2048m;

  # API
  location /api/ {
    proxy_pass http://kho_phim_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Stream media (hỗ trợ Range/seek). Backend sẽ trả 206 Partial Content.
  location /media/ {
    proxy_pass http://kho_phim_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;                 # stream trực tiếp, không đệm
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  # Frontend SPA
  location / {
    proxy_pass http://kho_phim_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
